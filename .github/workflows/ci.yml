name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  lint-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Ruff
        run: ruff check src tests airflow
      - name: Detect committed secrets
        run: |
          set -e
          if git grep -nE 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -- ':!*.example' ':!ci.yml' ; then
              echo "Possible secret committed!" && exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dbt
        run: pip install dbt-core==1.7.13 dbt-duckdb==1.7.4
      - name: dbt deps + parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt parse --target duckdb

  integration:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -r requirements.txt
      - name: Boot local infra
        run: |
          cp .env.example .env
          docker compose up -d minio fake-gcs
          # wait for MinIO
          for i in {1..20}; do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 2
          done
      - name: Seed buckets
        run: python -m src.utils.seed_local_infra
      - name: Integration tests
        run: pytest tests/integration -v
      - name: Tear down
        if: always()
        run: docker compose down -v
