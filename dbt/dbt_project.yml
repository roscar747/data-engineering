name: finsight
version: 0.1.0
config-version: 2
profile: finsight

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: [target, dbt_packages]

vars:
  start_date: "2024-01-01"

models:
  finsight:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: gold
      core:
        +tags: ["daily", "core"]
      finance:
        +tags: ["finance"]

snapshots:
  finsight:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: _silver_ts

seeds:
  finsight:
    +schema: seeds
    +quote_columns: true

tests:
  +severity: error
  +store_failures: true
